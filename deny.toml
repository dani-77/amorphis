[graph]
targets = [
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = []
skip = [
    { crate = "syn@2", reason = "proc-macro dependencies currently span the syn 2 and 3 major versions" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
