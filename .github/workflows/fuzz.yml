name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: 0.13.2
  FUZZ_SECONDS: 60

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
            max_len: 4096
          - target: image_ops
            max_len: 4096
          - target: png_decode
            max_len: 1048576

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libpam0g-dev \
            libwayland-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo-fuzz
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}

      - name: Install cargo-fuzz
        run: |
          echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> "$GITHUB_PATH"
          cargo install \
            --root "${{ runner.tool_cache }}/cargo-fuzz" \
            --version "$CARGO_FUZZ_VERSION" \
            --locked \
            cargo-fuzz

      - name: Run bounded fuzzing
        run: |
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_len="${{ matrix.max_len }}" \
            -max_total_time="$FUZZ_SECONDS"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
