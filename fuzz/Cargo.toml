[package]
name = "amorphis-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.amorphis]
path = ".."
version = "0.1.0"

[[bin]]
name = "cli"
path = "fuzz_targets/cli.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_ops"
path = "fuzz_targets/image_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "png_decode"
path = "fuzz_targets/png_decode.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
