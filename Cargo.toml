[package]
name = "amorphis"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A screen locker and idle daemon for Wayland and X11"
publish = false

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2.189"
pam-client2 = { version = "0.5.5", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
smithay-client-toolkit = "0.20.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
toml = "1.1"
x11rb = { version = "0.13.2", default-features = false, features = ["allow-unsafe-code", "image", "randr", "screensaver"] }
xkbcommon = { version = "0.8.0", features = ["x11"] }
zbus = "5.18.0"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = true

