# Copy to ${XDG_CONFIG_HOME:-$HOME/.config}/amorphis/idle.toml.
# timeout is in seconds. Run amorphis-idle once at session startup.
[[rule]]
timeout = 300
command = "amorphis"

# Instead, one rule may use a different command on each session:
# [[rule]]
# timeout = 900
# command_x11 = "slock"
# command_wayland = "kantele-locker"
# resume_command runs when activity returns, possibly before unlock.
# resume_command = "notify-send 'Session active'"
